[package]
name = "keyscribe"
version = "0.3.1"
edition = "2021"

[lib]
name = "keyscribe_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "keyscribe-cli"
path = "src/bin/keyscribe_cli.rs"

[features]
default = ["desktop-ui"]
native-ui = [
	"dep:eframe",
	"dep:egui_plot",
	"dep:egui-phosphor",
	"dep:image",
	"dep:rodio",
]
# Capability features. Desktop enables all of them; mobile/Android enables none
# of the ones that need a subprocess, a desktop C/C++ toolchain, or a huge model.
video = []
local-demucs = []
pdf-export = []
sheet-render = ["dep:verovioxide"]
mp3-encode = ["dep:mp3lame-encoder"]
desktop-only = [
	"dep:rfd",
	"video",
	"local-demucs",
	"pdf-export",
	"sheet-render",
	"mp3-encode",
]
desktop-ui = [
	"native-ui",
	"desktop-only",
]
# Egui UI on Android: shares native-ui but drops every desktop-only capability.
android = ["native-ui"]

[dependencies]
anyhow = "1.0"
libloading = "0.8"
pollster = "0.3"
eframe = { version = "0.27", optional = true }
egui_plot = { version = "0.27", optional = true }
egui-phosphor = { version = "0.5", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"], optional = true }
rfd = { version = "0.14", optional = true }
rodio = { version = "0.19", optional = true }
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
blake3 = "1.5"
zstd = "0.13"
directories = "5.0"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
signalsmith-stretch = "0.1.3"
musicxml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

# HFSFormer pipeline dependencies
# ONNX Runtime loaded dynamically from a Microsoft official GPU build.
# We ship onnxruntime.dll + onnxruntime_providers_cuda.dll (downloaded from
# the onnxruntime-gpu pip wheel) alongside the executable. This avoids the
# ort-sys prebuilt binaries which had a CUDA version mismatch issue.
# `load-dynamic` loads onnxruntime.dll at runtime via libloading; we call
# `ort::init_from()` to point it at our bundled DLL.
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "ndarray", "api-24"], default-features = false }
ndarray = "0.16"
ndarray-stats = "0.5"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1.9"
thiserror = "1.0"
verovioxide = { version = "0.3.0", optional = true }

# Beat tracking (replaces beat_this_final0.onnx)
beat-this = "1.0.0"

roxmltree = "0.20"
midly = "0.5.3"
hound = "3.5.1"
mp3lame-encoder = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive"] }

# Android: winit 0.29 needs one android-activity backend selected application-side.
# `winit` is a direct dep only so the lib can name `EventLoopBuilderExtAndroid`.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.5", features = ["native-activity"] }
winit = { version = "0.29", default-features = false, features = ["rwh_06", "android-native-activity"] }
jni = "0.21"
ndk-context = "0.1"

# Windows DPAPI for encrypting the MVSep API key at rest (user-bound).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[package.metadata.android]
package = "com.frantzes.keyscribe"
apk_name = "keyscribe"
build_targets = ["aarch64-linux-android"]
# ONNX models etc. bundled into the APK and copied to the sandbox on first run.
assets = "android/assets"
# Extra shared libs placed under android/libs/<abi>/ (e.g. libonnxruntime.so).
runtime_libs = "android/libs"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "KeyScribe"
extract_native_libs = true

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|density|uiMode"
always_retain_task_state = true

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
