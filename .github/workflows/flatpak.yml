name: Flatpak

# Builds the Linux Flatpak on GitHub's free runners and smoke-tests that the
# resulting bundle actually launches. The .flatpak bundle is uploaded as a
# build artifact so it can be sideloaded and tested.
#
# Requirements are installed automatically by the flatpak-github-actions
# container: flatpak-builder installs the org.freedesktop 24.08 runtime, SDK
# and the rust-stable SDK extension from Flathub at build time.

on:
  # Validation only: main-branch releases (AppImage + Flatpak attached to the
  # version-tag release) are built by build.yml. This workflow smoke-tests
  # the Flatpak on feature branches and PRs.
  push:
    branches: ["feat/flatpak-support"]
    paths:
      - "flatpak/**"
      - ".github/workflows/flatpak.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths:
      - "flatpak/**"
      - ".github/workflows/flatpak.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitignore"
  workflow_dispatch:

# Only one flatpak build per branch at a time; a newer push cancels older runs.
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Build & smoke-test Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak and create bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: keyscribe.flatpak
          manifest-path: flatpak/com.frantzes.keyscribe.yml
          build-dir: flatpak-build
          repo-dir: repo
          state-dir: .flatpak-builder
          cache-key: flatpak-builder
          upload-artifact: true
          run-tests: false

      - name: Prepare sandbox for flatpak run (machine-id, mask rofiles-fuse)
        run: |
          # dbus needs a machine-id, and flatpak-builder --run cannot spawn
          # rofiles-fuse inside this container (no /dev/fuse), so hide the
          # binary from PATH to make flatpak-builder fall back to a plain
          # sandbox ("rofiles-fuse not available, doing without").
          if [ ! -s /etc/machine-id ]; then
            dbus-uuidgen --ensure=/etc/machine-id 2>/dev/null \
              || sudo dbus-uuidgen --ensure=/etc/machine-id 2>/dev/null \
              || sudo sh -c 'cat /proc/sys/kernel/random/uuid > /etc/machine-id'
          fi
          echo "machine-id: $(cat /etc/machine-id 2>/dev/null || echo MISSING)"
          rofiles="$(command -v rofiles-fuse || true)"
          if [ -n "$rofiles" ]; then
            sudo rm -f "$rofiles" || rm -f "$rofiles"
            echo "masked rofiles-fuse: $rofiles"
          else
            echo "rofiles-fuse not found in PATH"
          fi

      - name: Verify installed layout
        run: |
          flatpak-builder --run flatpak-build flatpak/com.frantzes.keyscribe.yml sh -c '
            set -e
            test -x /app/bin/keyscribe && echo "ok: /app/bin/keyscribe"
            test -L /app/bin/libonnxruntime.so && echo "ok: /app/bin/libonnxruntime.so symlink"
            test -x /app/bin/ffmpeg && test -x /app/bin/ffprobe && echo "ok: ffmpeg/ffprobe"
            test -f /app/bin/models/htdemucs_6s.onnx && echo "ok: htdemucs model"
            test -f /app/bin/models/beat_this_small.onnx && echo "ok: beat model"
            test -f /app/bin/models/mel_spectrogram.onnx && echo "ok: mel model"
            test -f /app/bin/models/basic-pitch.onnx && echo "ok: basic-pitch model"
            test -f /app/bin/cuda/libonnxruntime.so && echo "ok: cuda/ort libs"
            test -f /app/bin/cuda/libcudart.so.12 && echo "ok: cuda runtime libs"
            test -f /app/share/applications/com.frantzes.keyscribe.desktop && echo "ok: desktop file"
            test -f /app/share/metainfo/com.frantzes.keyscribe.metainfo.xml && echo "ok: metainfo"
            test -f /app/share/icons/hicolor/256x256/apps/com.frantzes.keyscribe.png && echo "ok: icon"
          '

      - name: Smoke test — app launches and stays running under Xvfb
        run: |
          set +e
          dbus-run-session -- xvfb-run -a -e xvfb-error.log bash -c '
            flatpak-builder --run flatpak-build flatpak/com.frantzes.keyscribe.yml /app/bin/keyscribe > app.log 2>&1 &
            pid=$!
            for i in $(seq 1 45); do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid"
                code=$?
                echo "::error::App exited early (code $code). Output:"
                cat app.log
                if [ -s xvfb-error.log ]; then
                  echo "--- xvfb errors ---"
                  cat xvfb-error.log
                fi
                exit 1
              fi
              sleep 1
            done
            echo "App stayed alive for 45s under Xvfb — PASS"
            kill "$pid" 2>/dev/null
            wait "$pid" 2>/dev/null
          '
          code=$?
          exit $code
